# Jetson -> ESP32 channel map. EVERY port here is a PLACEHOLDER (TBD_...) until electrical
# gives the real pin/channel names; real hardware is refused while any TBD_ port remains.
# Device names match what hardware_api already uses (joint names, tread_left, ...).
# From the "Robot Power - Final" diagram: the ESP32 drives the motor controllers (2 treads,
# crusher, 4 arm) and the servo driver (Door, Head, Arm), and runs the radio and sensors.
esp32:
  serial_port: /dev/ttyACM0   # TODO: USB serial (per diagram). A Jetson header UART would be /dev/ttyTHS1
  baud: 921600                # TODO: must match the firmware
  reply_timeout: 0.1          # s to wait for each reply
  retries: 2
  watchdog_timeout: 0.5       # s; must match the firmware
devices:
  # ---- motors (each has an encoder). max_permille: 600 = the 60% cap; 1000 = full speed.
  tread_left:   {kind: motor, port: TBD_TREAD_L,  invert: false, max_permille: 600, ticks_per_rev: 2000}  # goBILDA Saturn
  tread_right:  {kind: motor, port: TBD_TREAD_R,  invert: true,  max_permille: 600, ticks_per_rev: 2000}  # goBILDA Saturn; mirrored, so inverted (TODO verify)
  crusher:      {kind: motor, port: TBD_CRUSHER,  invert: false, max_permille: 600, ticks_per_rev: 2000}  # Yellow Jacket
  # Arm 1-4 in the diagram. Names match arm_joint_names in peripherals.yaml (placeholders there too).
  shoulder_pan:  {kind: motor, port: TBD_ARM1, invert: false, max_permille: 600, ticks_per_rev: 2000, min_deg: -90, max_deg: 90, center_deg: 0}
  shoulder_lift: {kind: motor, port: TBD_ARM2, invert: false, max_permille: 600, ticks_per_rev: 2000, min_deg: -30, max_deg: 90, center_deg: 0}
  elbow:         {kind: motor, port: TBD_ARM3, invert: false, max_permille: 600, ticks_per_rev: 2000, min_deg: 0,   max_deg: 145, center_deg: 0}
  wrist:         {kind: motor, port: TBD_ARM4, invert: false, max_permille: 600, ticks_per_rev: 2000, min_deg: -90, max_deg: 90, center_deg: 0}
  # ---- servos (servo driver, logic from the ESP32). Degrees are in the servo's own frame.
  door:       {kind: servo, port: TBD_SERVO_DOOR, min_deg: 0,   max_deg: 90,  center_deg: 0}
  head_pan:   {kind: servo, port: TBD_SERVO_HEAD_PAN,  min_deg: -70, max_deg: 70, center_deg: 0}
  head_tilt:  {kind: servo, port: TBD_SERVO_HEAD_TILT, min_deg: -30, max_deg: 30, center_deg: 0}
  eye_left:   {kind: servo, port: TBD_SERVO_EYE_L, min_deg: -30, max_deg: 30, center_deg: 0}
  eye_right:  {kind: servo, port: TBD_SERVO_EYE_R, min_deg: -30, max_deg: 30, center_deg: 0}
  gripper:    {kind: servo, port: TBD_SERVO_GRIPPER, min_deg: 0, max_deg: 90, center_deg: 0}   # min = open, max = closed
  # ---- inputs / outputs (sensors run off the ESP32's 3.3 V)
  gripper_contact:        {kind: din, port: TBD_DIN_GRIPPER, invert: false}
  crusher_chamber_closed: {kind: din, port: TBD_DIN_CHAMBER, invert: false}   # invert: true if the switch is active-low
  crusher_lock_engaged:   {kind: din, port: TBD_DIN_LOCK,    invert: false}
  crusher_contents_ok:    {kind: din, port: TBD_DIN_CONTENTS, invert: false}
  range_front:            {kind: range, port: TBD_RANGE_FRONT}                # HC-SR04P
